  "codex exec  -> gpt-image-2   (ChatGPT sub)  VERIFIED WORKING 2026-07-25",
  "claude code                  (Claude sub)   installed, OAuth",
  "grok build                   (SuperGrok)    coding agent; xAI image/video is metered",
  "gemini cli                   (Google acct)  not yet installed here",
]
