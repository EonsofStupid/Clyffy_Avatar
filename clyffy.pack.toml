# ── ANIMATION CONTRACT ────────────────────────────────────────────────────────
# OPERATOR CORRECTION 2026-07-25: **AVATAR ANIMATION IS BLENDER, AUTHORED BY US.**
# It is NOT generated clips. I previously conflated two separate production paths:
#   * 04_storyboard_stills_animations.md = GENERATED concept animations for the EOS
#     lesson pipeline — character-free, abstract, hosted generation. Different domain.
#   * THIS = rigged character animation for Clyffy, hand-authored in Blender, local.
# The "LANE NOTE (locked 2026-07-08): higgsfield only" from that doc DOES NOT APPLY
# here and was never a constraint on avatar work. Removed as a false conflict.

[animation]
# BOTH/AND, never either/or. Sources COMPOSE — they are not alternatives.
#   * Blender  — rigged, hand-authored character animation, local on the GB10 cluster.
#                This is the spine: the rig, the visemes, the canonical rest poses.
#   * Generated — image/video/audio via ComfyUI on the GB10 cluster AND via frontier
#                providers. Fills, backgrounds, concept sets, motion reference, b-roll.
# Neither replaces the other. A shot may be Blender character over generated plate,
# or generated concept with Blender-authored rest states. Assume mixture.
sources = ["blender-local", "comfyui-gb10", "frontier-generated"]

# THE REST-STATE LAW still applies — as behaviour, not as production method.
# (Principle borrowed from 04_storyboard_stills_animations.md, verbatim:)
law = "EVERY animation must reach a stable rest state and hold (loop/freeze)"

# Why it generalises: written for a human presenter narrating between beats — an
# unknown-length gap the visual must survive gracefully. Rumination is the SAME
# problem. A spinner announces waiting; a rest loop simply IS, and the wait stops
# reading as a wait. This is Pulse 4 ("the pause is the product") made visible.
rest_required = true
rest_kinds    = ["loop", "freeze"]

# One rig, authored once, drives BOTH the live avatar and DevPULSE News.
