[rig.look_at]
# ⭐ PIN: VRM lookAt in BONE mode, not expression mode.
# VERIFIED 2026-07-26 (tools/_facecheck.py, solid shading with the texture stripped): the
# eyes are REAL GEOMETRY — spherical domes seated in sockets, each with a distinct rim
# crease. The v1 BUILD_LOG claim "eyeballs are welded into the head surface, not spheres"
# is WRONG for v2. The iris/pupil is painted on the dome, so separating the dome along its
# socket rim and ROTATING it moves the gaze correctly. Gaze is a rotation, not a UV hack.
type      = "bone"
method    = "separate the eyeball domes along the socket rim, then rotate — the same play as the lip seam"
seam      = "socket rim crease, visible in solid shading"
# The eyeLook* entries in the ARKit set become derived/optional once lookAt is bone-driven.
derived_from_bone = ["eyeLookDownLeft","eyeLookDownRight","eyeLookInLeft","eyeLookInRight",
                     "eyeLookOutLeft","eyeLookOutRight","eyeLookUpLeft","eyeLookUpRight"]
# ✅ BLINK RESOLVED 2026-07-26 (tools/eye_probe.py) — and it collapses two tasks into one.
# Measured: the socket rims are CLEAN CLOSED RINGS (51 and 41 verts, symmetric at lateral
# -0.0421 / +0.0373), and the domes are genuine spheres — least-squares fit on the isolated
# cap gives r=0.0318 / 0.0288 with residual 4% / 7% of radius.
# A naive blink (collapse the eye region vertically, 1003 verts) FAILS: it squashes the
# EYEBALL along with the skin, giving a distorted still-visible eye rather than a closed
# lid. That is unavoidable while the mesh is welded — dome and skin share the rim, so the
# skin cannot slide over the eye because it is attached to it.
# => BLINK AND GAZE ARE THE SAME JOB. Cut the dome free along the socket rim (the same
#    operation as the lip seam), and then: the eyeball is rigid and ROTATES for gaze, while
#    the skin ring CLOSES OVER it for blink. Do not attempt either before the separation.
# ✅ BOTH PROVEN 2026-07-26 on the separated mesh (tools/eye_open.py + tools/_gazetest.py).
# GAZE: rotating each dome about its fitted centre moves the painted iris with it — gaze
#       is a rotation, confirmed on render at ±16° yaw and ±12° pitch.
# BLINK: the lid must SLIDE OVER the dome, not collapse toward the eye centre's z-plane.
#        Collapsing z closes the skin BEHIND the eyeball — whose apex protrudes a full
#        radius in front of that plane — so the eye pokes through. Correct construction:
#        rotate each skin vert about the LATERAL axis around the eye centre until its
#        elevation reaches the midline, holding radius >= r*1.06 so it passes in front.
#        Falloff must be TIGHT (reach ≈ 1.38·r): at 2.1·r the brow and cheek get dragged
#        in and the face crumples.
blink        = "skin ring slides over a separated, rigid dome at radius >= 1.06r"
blink_falloff_reach = 1.38      # × dome radius. 2.1 crumples the face.
separated    = true             # 3 connected components: body 45856, eye_L 585, eye_R 397
eye_groups   = ["eye_L", "eye_R"]   # + object props eye_{L,R}_center / _radius for bone placement
blink_travel = 0.0531   # left; right 0.0554. ~5.4-5.7% of body height for a full close
rim_verts    = { left = 51, right = 41 }
dome_fit     = { left_r = 0.0318, right_r = 0.0288, residual_pct = "4-7% of radius" }

