# CHARACTER PACK MANIFEST — clyffy
#
# One of these per character in CLYFFY_AND_MINIONS. Declarative source of truth for the
# avatar build, mirroring the capability-pack pattern. Every tool reads values from here
# rather than re-deriving them, because re-deriving is what got the wrong part of his
# skull cut open.

name        = "clyffy"
species     = "holstein-cow"
build       = "anthropomorphic-biped"
role        = "Lead AI Synergist · show protagonist · 'The OS'"
origin      = "the operator turned into a lead character"

# ── PACK FREEZE ───────────────────────────────────────────────────────────────
# v0.1-talk-ready: face + rig + control surface frozen for local voice work.
# Live companion window / E2 / fingers / goggles / ASR phonemes are NOT in this freeze.
[pack]
version     = "0.1.0-talk-ready"
frozen_at   = "2026-07-27"
status      = "STATUS.md"
blender     = "/opt/blender-5.2.0/blender-wrapper.sh"
blender_min = "5.2"
gate        = "G1–G7 in STATUS.md — open local voice job only when accept is green"

# ── CALIBRATION ───────────────────────────────────────────────────────────────
# MEASURED, never inferred — and MEASURED IN A DECLARED SPACE. An angle without a space
# is not a calibration. The 225.0 recorded here on 2026-07-25 was wrong twice over and
# cost three failed jaw rigs; see BUILD_LOG 2026-07-25 (axis correction) for the full
# account. Both errors are now closed:
#
#   1. WRONG SPACE. 225.0 was read off a render sweep, and renders are WORLD space. Every
#      tool then applied it to `v.co`, which is LOCAL. The Tripo object carried a +69.17
#      deg Z rotation, so the hinge axis was 69 deg off and the mouth cavity was extruded
#      into the cheek. FIXED AT SOURCE: tools/canonicalize.py freezes the transform, so
#      the canonical mesh has identity rotation and local == world. Tools assert it.
#   2. WRONG VALUE. Re-measured two independent ways that agree to 1.4 deg:
#        3D bilateral-symmetry solve (tools/head_axis.py)   233.75 deg
#        image mirror-difference scan (tools/_mirrorscore.py) 235.12 deg  <- unimodal curve
#      225.0 scores 0.058 mirror-difference vs 0.008 at the minimum: ~6x worse. It looked
#      head-on to the eye, which is exactly why eyeballing a contact sheet is not a method.
[calibration]
forward_axis_deg = 235.1        # MEASURED 2026-07-25, two independent solvers, WORLD space
forward_axis_space = "world == local on the canonical mesh (transform frozen)"
up_axis          = "+Z"
scale_note       = "source meshes arrive normalised (~1 unit tall), NOT metres — set real height before rigging"
camera_convention = "loc = ctr + (sin a, -cos a) * R ; rot = (90deg, 0, a)"

# ── CANONICAL ASSET CHAIN ─────────────────────────────────────────────────────
# Build in this order; each stage asserts its input is canonical.
[pipeline]
canonical  = "mesh/canon/clyffy_v2_canon.blend"   # tools/canonicalize.py — frozen transform, operator groups baked, cleaned
mouth_open = "mesh/canon/clyffy_v2_open.blend"    # tools/mouth_open.py   — seam cut, cavity
chin_mass  = "mesh/canon/clyffy_v2_chin.blend"    # tools/chin_mass.py    — mandible growth (displacement only)
eyes_open  = "mesh/canon/clyffy_v2_eyes.blend"    # tools/eye_open.py     — eyeball domes separated on the socket rim
parts      = "mesh/canon/clyffy_v2_parts.blend"   # tools/mouth_parts.py  — teeth arcs + tongue inside the bag
atlas      = "mesh/canon/clyffy_v2_atlas.blend"   # tools/face_atlas.py   — weighted facial region groups
shapes     = "mesh/canon/shapes/clyffy_v2_shapes.blend"  # tools/shape_author.py — ARKit-52 blendshapes
rigged     = "mesh/canon/clyffy_v2_rig.blend"     # tools/jaw_rig.py      — jaw/skull/root only (face proven)
body       = "mesh/canon/body/clyffy_v2_body.blend"  # tools/body_rig.py — VRM-humanoid + face weights
# Lip rest seal (tools/lip_seal.py) runs on parts BEFORE atlas/shapes so the rest
# pose does not tunnel-view the teeth. amount=0.85, fwd_bulk=0.0025H, teeth_inset=0.008H.
# The operator's hand-picked regions live IN the canonical mesh as vertex groups
# (op_jaw_region 390, op_lip_seam 81), not as raw vertex indices in side .blend files.
# Indices force every downstream step to preserve numbering exactly; groups do not.
operator_groups = ["op_jaw_region", "op_lip_seam"]

# ── BUILD PARAMETERS (settled by measurement — see BUILD_LOG 2026-07-25) ──────
# These are the tool defaults. Recorded here so the chain is reproducible and so the
# values that were REJECTED are not silently retried.
[cut]
depth        = 0.12       # fraction of body height. Must EXCEED the widest aperture the
                          # jaw reaches (0.055 at 22 deg) or the jaw swings past the back wall.
# "depthfrac:lateral_scale:half_height". The original profile scaled rings UNIFORMLY
# toward the hole centroid and produced a flat SLOT — 0.1846 deep, 0.1445 wide, 0.0077
# TALL. No room for teeth (~0.009), let alone a tongue. Rings now expand vertically into
# a real bag (0.0504 tall) behind the lips, while the lip line stays shut at rest.
ring_profile = "0.30:0.98:0.015,0.70:0.92:0.033,1.00:0.60:0.026"
bag_height   = 0.0504
rim_relax    = 0          # REJECTED at every setting: plain Laplacian shrinks the loop 4.6%,
                          # Taubin fixes shrinkage (-0.63%) but BOTH put bright specks along
                          # the lip line in the REST pose. The slit is 0.0077 tall, so even a
                          # 0.0032 vertex move is ~40% of it. Rest pose wins.

[chin_mass]
# Added 2026-07-28 (M2). Grows a mandible as a smooth DISPLACEMENT FIELD — no new geometry,
# vertex count and indices preserved, because body_rig.py transfers face weights BY VERTEX
# INDEX and asserts equal counts. Growth is measured from the JAWLINE PLANE (hinge + lip
# line), the same plane jaw_rig.py splits weights on, so the lip line never moves.
depth       = 0.045       # DEEPENED 2026-07-28 once the lip rim was unfrozen. While the aperture
                          # came only from jaw rotation, chin depth traded against gape 1:1 and
                          # 0.028 was the ceiling. The lips now carry ~1.2%H of aperture on their
                          # own, so the jaw could drop to 10 deg and the chin could be defined.
u_dead      = 0.014       # NOT optional — the lip slit is 0.0077 tall with ~0.0008 edges, so a
                          # ramp starting at u=0 tore it 4.67x and erupted two white "fangs"
                          # at the commissures. Holding the field at zero across the slit
                          # removes both at zero cost to the mandible.
u_lo        = 0.032
u_hi        = 0.048
u_max       = 0.105       # ramp-out must satisfy (u_max-u_hi) > 1.5*depth or the surface
                          # FOLDS through itself. Asserted in-tool; it fired on depth 0.055.
fill        = 0.006       # forward fill. Keep small — this is what turns a jaw into a jowl.
along       = [0.020, 0.140]   # ramp the mass in toward the chin; a flat mask thickens the
                               # whole jaw and merges its rear into the neck
lateral     = [0.070, 0.140]   # mouth half-span is ~0.072H — keep growth under the mouth
protected   = ["mouth interior", "lip rim", "eyes", "teeth", "tongue", "navy garment"]
# ⛔ THE GARMENT IS TEXTURE ON THE SAME SURFACE — there is no separate shirt mesh, so
# displacing geometry under it drags the collar. Protected by SAMPLING the base-colour image
# per vertex UV. Do NOT locate the collar with max(navy z): the lanyard is blue too and
# reports z +0.3527, above the mouth. Scan DOWN for the first band that turns navy.
collar_z    = 0.1377      # = 9.00%H below the lip line. The hard ceiling on chin depth.
measured    = { rigid_jaw_core = "742 -> 1316", mean_jaw_weight = "0.506 -> 0.601", edge_stretch_max = 2.92, verts_moved = 1302 }

[jaw_rig]
# ⚠️ 22.0 -> 13.0 on 2026-07-28. The collar sits 9.00%H below the lip line and that is the
# whole budget for chin AND neck: with chin depth D and drop d, the chin underside lands at
# D+d and must stay above the collar, so d < 9.0-D. The chin ships at ~4.5%H, already the
# optimum of min(D, 9-D), which caps d at ~4.5%H ~ 13 deg. An independent angle ladder
# agreed by eye (work/m2_ladder): 12-15 reads as a mouth, 18 eats the chin, 22 is a
# rectangle. GROWING THE CHIN DOES NOT BUY GAPE — it trades against it one-for-one. The only
# change that raises this ceiling is moving the collar DOWN.
angle_deg    = 10.0       # 22 -> 13 (collar) -> 10 (chin). Each cut was paid for: 13 by the
                          # collar arithmetic, 10 by lip-driven aperture after the rim unfreeze.
hinge_back   = 0.75       # fraction of face depth behind the face front
hinge_up     = 0.30       # fraction of (top-of-head - mouth); a low hinge scissors, it does not swing
corner_r     = 0.020      # commissure relief radius, ABSOLUTE. Keep small vs the rim half-span
                          # (0.072): at 0.044 it frees the upper lip and the aperture collapses.
smooth       = 0          # post-solve weight relax: cut >2x edges 85->60 but RAISED the max
                          # to 4.07x and eroded the rigid core 742->560. Not worth it.
bones        = ["root", "skull", "jaw"]
skin_groups  = ["root", "skull", "jaw"]
# Teeth, tongue and eyeballs are SEPARATE connected components. A component with no
# anchor makes L_FF singular and the harmonic solve ill-posed, so each is anchored
# rigidly rather than left to the solver.
rigid_anchors = { teeth_lower = 1.0, tongue = 1.0, teeth_upper = 0.0, eye_L = 0.0, eye_R = 0.0 }

[mouth_parts]
inset     = 0.030   # back from the lip rim; far enough that the closed lips hide everything
tooth_h   = 0.009
tooth_d   = 0.008
# ── M3, 2026-07-28 — three fixes, each measured. See BUILD_LOG "M3 (2026-07-28)". ──
# BITE PLANE: both arches close onto the mid-height of the closed rim. Building each band off
# its OWN lip chain overlapped them by ~0.0068 (chains 0.0077 apart, bands 0.009 tall) and
# they stayed interpenetrated to 35% open — that z-fighting was the "torn white ribbon".
bite_plane = "mid-height of the closed lip rim (z +0.2257)"
# OVERBITE/OVERJET: a flat bite plane hides the teeth (upper crown lands level with the upper
# lip rim → 0.0007 of tooth visible when open). Upper crowns hang BELOW the lower ones and
# clear them FORWARD, so separation is horizontal and the jaw only ever increases it.
overbite  = 0.0035
overjet   = 0.006
# INWARD OFFSET is per-point (local lip tangent rotated 90°), oriented toward the CAVITY
# CENTROID. A global -fwd offset drove the bands into the cheek at the commissures — the
# white tooth slivers in every hero since the parts were added. Orienting by -fwd instead of
# the centroid is ill-conditioned at the corners (dot ~0) and flipped some end rings OUTWARD,
# putting teeth at arch position 1.43 — wider than the mouth, and immune to `inset`.
inward    = "per-point local normal, oriented toward the cavity centroid"
# CONTAINMENT is a measured gate now, not an eyeballed render. 15-ray fan per interior vertex;
# a ray that escapes = visible. Authoritative copy is in lip_seal.py (the sealed rest pose is
# what ships); the copy in mouth_parts.py is PRE-SEAL and advisory — central leaks there are
# the open slit, leaks near arch position 1.0 are the real defect.
containment = { teeth_lower = 0, teeth_upper = 0, tongue = 0, of = "104 / 96 / 242" }
separation  = { at_035 = 1.15, at_070 = 2.57, at_100 = 3.82, unit = "%H min 3D distance" }
# The tongue's dimensions used to live here as `tongue = { lat = 0.052, fwd = 0.075, h = 0.013 }`
# — the UV-sphere ellipsoid. It is now AUTHORED and every dimension is derived from the cavity
# at build time, so it has its own section: see [mouth_parts.tongue].
materials = ["clyffy_teeth", "clyffy_tongue"]
groups    = ["teeth_upper", "teeth_lower", "tongue"]
note      = "diffuse_color is set on both materials — Workbench/solid reads that, NOT the Principled input"

# ── FACIAL REGION ATLAS (foundation for every blendshape) ────────────────────
# Every authored shape deforms a NAMED, WEIGHTED region. Detecting regions once and
# reusing them is what stops each shape re-deriving geometry — the failure mode that has
# bitten this build four times (world-vs-local space, sphere fit over the wrong support
# set, lip classified by z instead of by chain, ancestor lookup with a silent fallback).
# Weights are smooth falloffs, NEVER binary: a binary region tears at its edge exactly
# like the 1.0-next-to-0.0 lip rim did.
[atlas]
regions = ["lip_upper","lip_lower","lip_corner_L","lip_corner_R",
           "eyelid_upper_L","eyelid_lower_L","eyelid_upper_R","eyelid_lower_R",
           "brow_L","brow_R","cheek_L","cheek_R","nose"]
# Seeds must be SNAPPED TO THE SURFACE. A seed left inside the head is far from every
# vertex: the nose seed produced 0 verts and the cheek seed peaked at 0.40 instead of 1.0.
seed_rule = "snap to nearest skin vertex; nose = most-protruding muzzle vert between lip and eyes"
# Symmetry is measured SPATIALLY, not by vertex count — the eyeball domes are themselves
# 585 vs 397 verts, so this mesh's density is genuinely asymmetric and a count ratio looks
# skewed even when placement is correct.
symmetry_metric = "mirror the L weighted centroid across the midplane, compare to R"
symmetry_worst  = 0.0148        # lip_corner, 1.51% of body height — all regions pass

[atlas.protected]
# Skin shapes must NEVER move these; they are bone-driven.
verts = 1576
members = ["eye_L","eye_R","mouth bag (cav material)","teeth_upper","teeth_lower","tongue"]

# ── SHAPES (tools/shape_author.py over the atlas) ─────────────────────────────
# FULL HEAD complete 2026-07-26. ARKit-52 = 43 authored + jawOpen (bone) + 8 eyeLook* (bone).
[shapes]
blend   = "mesh/canon/shapes/clyffy_v2_shapes.blend"
count_authored = 43
arkit_complete = true          # 43 + jawOpen + 8 eyeLook* = 52
protected_leaks = 0
# Exceptions to the 1576-vert protect set (match bone-anchored interior membership):
jaw_interior_exception    = ["teeth_lower", "tongue", "lower_cavity"]   # jaw* only
tongue_out_exception      = ["tongue"]                                  # tongueOut only
sheets = ["mesh/canon/shapes/_headsheet.jpg",
          "mesh/canon/shapes/_blinksheet.jpg",
          "mesh/canon/shapes/_eyesheet.jpg",
          "mesh/canon/shapes/_browsheet.jpg",
          "mesh/canon/shapes/_mouthsheet.jpg",
          "mesh/canon/shapes/_mouthsheet2.jpg",
          "mesh/canon/shapes/_jawsheet.jpg",
          "mesh/canon/shapes/_cheeknosesheet.jpg"]
authored_A = ["eyeBlinkLeft","eyeBlinkRight"]
authored_B = ["eyeSquintLeft","eyeSquintRight","eyeWideLeft","eyeWideRight",
              "browDownLeft","browDownRight","browInnerUp","browOuterUpLeft","browOuterUpRight"]
authored_C = ["jawForward","jawLeft","jawRight",
              "mouthSmileLeft","mouthSmileRight","mouthFrownLeft","mouthFrownRight",
              "mouthStretchLeft","mouthStretchRight","mouthDimpleLeft","mouthDimpleRight",
              "mouthUpperUpLeft","mouthUpperUpRight","mouthLowerDownLeft","mouthLowerDownRight",
              "mouthPressLeft","mouthPressRight","mouthPucker","mouthFunnel",
              "mouthRollUpper","mouthRollLower","mouthShrugUpper","mouthShrugLower",
              "mouthClose","mouthLeft","mouthRight"]
authored_D = ["cheekPuff","cheekSquintLeft","cheekSquintRight",
              "noseSneerLeft","noseSneerRight","tongueOut"]
# House rules:
#   * never binary-translate a region — expand_falloff or the rim tears
#   * jaw blendshapes must carry the jaw-anchored interior or teeth stay behind
#   * vertical lip separation past ~1%H opens the cavity onto unmoved upper teeth
#   * tongueOut must clear the 0.030 tooth inset (~0.048H forward) or it is invisible

# Acceptance thresholds the rig currently meets — regressions should trip these.
[jaw_rig.verified]
max_edge_stretch   = 3.85     # tools/stretch_map.py at angle_deg
edges_over_5x      = 0
weight_jumps_gt_05 = 0        # tools/_edgeprobe.py — |w0-w1| > 0.5 across any mesh edge
weight_symmetry    = 1.03     # ratio of mean jaw weight, +side vs -side
upper_lip_movement = 0.0101
partition_of_unity = 8.9e-05  # max |1 - sum(weights)| per vertex
max_influences     = 3

# ── SOURCE ART ────────────────────────────────────────────────────────────────
[sources]
base_sheet   = "canon/base_sheet/Clyffy_BASE-NEUTRAL-v1.png"   # decision A3 — neutral, prop-free
base_views   = "work/views_base/BASE_*.png"
look_av      = "canon/CLYFFY/AV/canonical/Clyffy_Episodic-Kenny-Protocol.png"
look_dpn     = "canon/CLYFFY/DPN/Clyffy_Anchor-Standalone-FINAL.png"
excluded     = ["canon/CLYFFY/DPN/canonical/Clyffy_News-Anchor-v1.png"]  # non-canon: singed coat in DPN, no lanyard, adds headset

# ── LAYERING ──────────────────────────────────────────────────────────────────
# The base body is modelled and rigged BARE. Everything else is separate geometry
# parented to the rig. This is what makes decision A2 achievable.
[layers]
base_body      = ["fur", "horns", "ears", "muzzle", "tail", "cloven-hooves"]
base_garment   = "navy-devpulse-tshirt"
outer_garment  = ["labcoat-clean-dpn", "labcoat-singed-av"]
props          = ["goggles", "blue-lanyard", "clyffy-id-badge"]

# ── CANON RULES (enforceable) ─────────────────────────────────────────────────
[rules]
goggles           = "clear polycarbonate laboratory safety"   # OPERATOR RULING 2026-07-25
goggles_banned    = ["brass", "steampunk", "aviator", "tinted"]  # old drift, present in the AV art
goggles_states    = ["on-face", "pushed-up", "resting-on-desk", "in-hand"]
goggles_absent_ok = false        # never absent from a scene
banned            = ["cowbell", "bell", "chain", "necklace"]
required          = ["blue-lanyard", "clyffy-id-badge", "goggles"]
never_mix         = "singed coat in a DPN scene is rejected output"

[style_lock]
render   = "Pixar CGI quality x Arcane painterly colour grading"
fur      = "subsurface scattering — no exceptions"
lighting = ["deep teal shadow pools", "electric amber rim light", "cold steel-blue monitor fill"]
forbid   = ["ink outlines", "cel-shading", "2D cartoon", "flat illustration"]

# ── VOICE ─────────────────────────────────────────────────────────────────────
[voice]
description = "warm confident baritone"
signature   = "We are doing this today."
tic         = "pivots mid-sentence and presents it as the plan"
# Talking voice (audio) — establishment 2026-07-27. Face API is the control surface;
# do not invent a second lipsync contract for TTS.
register_token   = "voice:VOICE-CORPUS:REDACTED — private, see canon/_MASTER_REGISTRY.md"  # Drive corpus; platform clone NOT created
reference_audio  = "work/voice/clyffy-blend1-voice.mp3"           # pull from Drive if missing
reference_status = "may be missing locally — brief + new samples still valid"
tts_slot         = "voice.tts"   # WiredFront / clyffy model slot — do NOT hardcode a model name
tts_target       = "local-gb10-first"  # platform clone only on explicit operator go
# ── IDENTITY REFERENCE (F3, operator-picked 2026-07-27) ──────────────────────
# A/B ran four takes on the five sample_lines: Mark, Andre, Mark-pushed, Zane.
# Operator picked the PUSHED Mark. This is the YARDSTICK the local GB10 slot tunes
# toward — it is NOT the backend. tts_target above is unchanged and still local-first;
# no platform clone was created and none is authorised.
identity_ref     = "higgsfield seed_audio · preset Mark · speech_rate +18 · loudness_rate +14 · pitch_rate +1"
identity_wav     = "work/voice/ab/C_mark_zane.wav"        # + C_mark_zane_mono.wav (24k mono, rig-ready)
identity_drive   = "work/voice/drive/ab_C_mark_push/alpha_talk.mp4"   # waist-up
identity_drive_full = "work/voice/drive/ab_C_full/alpha_talk.mp4"     # full-body
identity_note    = "presets cannot be blended; 'Mark with Zane energy' was realised as Mark driven on the tuning params, with a straight Zane take kept as the energy reference (work/voice/ab/D_zane_ref.wav)"
# Local adapter (2026-07-27): OuteTTS via llama-tts — v0 scaffold, not final identity clone
backend          = "llama-tts/outetts-0.2"
tool             = "tools/voice_tts.py"
tts_bin          = "/home/hades/llama-cpp-roce/build/bin/llama-tts"
llm_gguf         = "work/voice/models/OuteTTS-0.2-500M-Q5_K_M.gguf"
vocoder_gguf     = "work/voice/models/WavTokenizer-Large-75-F16.gguf"
speaker          = "built-in en_male_1 default (external speaker json optional)"
samples_dir      = "work/voice/samples"
drive_dir        = "work/voice/drive_v2"
drive_dir_stale  = "work/voice/drive — 2026-07-27, driven on the PRE-TONGUE face; kept for A/B only"
# ⚠️ THE VOICE WAS BUILT 2026-07-27 (Phase V, V1-V5 green). NOT open work. The only
# outstanding item is V6, the OPERATOR A/B in work/voice/SAMPLES.md.
# ── 2026-07-29 RE-RENDERED THE FACE ONLY ────────────────────────────────────
# The 2026-07-27 drive mp4s showed the voice over a face that predated the tongue, the four
# articulation morphs, the jaw-angle contract fix and the mesh patch, so anything built on
# them would show the OLD mouth. Same five wavs, current face. NO audio was synthesized, NO
# models were touched, work/voice/drive/ is intact. This is a render, not voice work.
review_reel      = "work/voice/drive_v2/_all_lines.mp4"
review_reel_secs = 9.19
