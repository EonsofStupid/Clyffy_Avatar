# ── GENERATION FABRIC ─────────────────────────────────────────────────────────
# OPERATOR, 2026-07-25: "I will have support for subscriptions, API keys, and local
# eventually even working as together as one."
#
# There is NO single lane. The old "LANE NOTE (locked 2026-07-08): higgsfield only"
# in 04_storyboard_stills_animations.md is stale and was never a constraint on avatar
# work. Do not treat any provider as exclusive, and do not declare work blocked
# because one of them is exhausted.
[generation]
