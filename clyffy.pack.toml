  "We are doing this today.",
  "Alright — here is the plan.",
  "That is the root cause. We fix it at the source.",
  "Hold on. I am thinking.",
  "Done. Check the gate.",
]
export_format    = "wav mono 24k; pass each sample through tools/avatar_drive.py"
status_note      = "v0 voice scaffold 2026-07-27 — operator A/B required before calling it Clyffy identity"

# ── RIG TARGET ────────────────────────────────────────────────────────────────
# REAFFIRMED + EXTENDED 2026-07-26 after checking the 2026 format landscape (operator
# asked whether VRM is still the right call). It is, and more so than when A1 was made:
#   * Khronos Group and the VRM Consortium are formally collaborating; VRM is heading for
#     Khronos glTF Ratified Extension status and an ISO/IEC path behind that. glTF 2.0 is
#     already ISO/IEC 12113:2022 — and VRM *is* glTF plus extensions, so nothing is
#     stranded if the avatar layer ever moves.
#   * OpenUSD is NOT the competitor it looks like. AOUSD and Khronos hold a formal liaison
#     agreement on the split: USD authors (layers, overrides, variants), glTF delivers
#     (compact, to a browser / phone / real-time renderer). BOTH/AND — if DevPulse News
#     ever wants film-grade episode rendering, USD is the authoring side and VRM/glTF
#     stays the delivery side.
#   * Gaussian splatting is the loud 2026 thing (KHR_gaussian_splatting shipped Feb 2026)
#     but is photoreal-plus-3D, not yet shippable, and the wrong tool for a stylised cow.
#     2D-neural and 3D-rigged are the production-ready options; we want rigged.
# The COMPANION APP is the real target and it is REAL-TIME, not rendered. Everything built
# so far renders frames offline in Blender — correct for episodes, insufficient for a
# desktop companion. Authoring to VRM from here avoids a retrofit.
[rig]
format      = "VRM"              # decision A1 — bipedal, so humanoid tooling applies
spring_bones = ["ears", "tail"]  # a cow has no eyebrows; the EARS carry the emotion
visemes     = "SHARED between the live avatar and rendered episodes — do not fork"
open_issue  = "DPN episodic-rendered vs live decides whether visemes optimise for inference or render quality"

# VRM gives three of our requirements as SPEC FEATURES rather than things we implement:
# lookAt (gaze), spring bones (ears/tail), and the expression system.
# Non-humanoid geometry (horns, muzzle, tail) rides alongside the humanoid set as
# non-humanoid bones — well-trodden ground in the anthropomorphic VTuber space.
[rig.blendshapes]
# ⭐ PIN: author the face ONCE at ARKit-52 "Perfect Sync" resolution, NOT VRM's small
# native expression set. Reasons, in order of weight:
#   1. 52 shapes DOWNSAMPLE cleanly into VRM expression presets. Authoring VRM's handful
#      first UPSAMPLES into nothing — that is the difference between one authoring pass
#      and two.
#   2. ARKit-ready VRMs are driven live by any iPhone. That IS the phone surface, free.
#   3. It is the de-facto interchange vocabulary (MetaHuman, Ready Player Me, face capture).
vocabulary = "ARKit-52 Perfect Sync"
count      = 52
brow   = ["browDownLeft","browDownRight","browInnerUp","browOuterUpLeft","browOuterUpRight"]
cheek  = ["cheekPuff","cheekSquintLeft","cheekSquintRight"]
eye    = ["eyeBlinkLeft","eyeBlinkRight","eyeLookDownLeft","eyeLookDownRight","eyeLookInLeft","eyeLookInRight",
          "eyeLookOutLeft","eyeLookOutRight","eyeLookUpLeft","eyeLookUpRight","eyeSquintLeft","eyeSquintRight",
