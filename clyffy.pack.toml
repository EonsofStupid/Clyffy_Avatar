# THE ENVIRONMENT THE OPERATOR BUILT — this is the point. The cluster is not a
# fallback for when credits run out; it is the generation engine, and the frontier
# subscriptions drive it rather than replace it.
local = "ComfyUI on the 3-node GB10 cluster — image / video / audio"

status = "TARGET ARCHITECTURE — cluster exists, config system and ComfyUI app not yet built"

# ── MODE CONTRACT ─────────────────────────────────────────────────────────────
# OPERATOR, 2026-07-25. **MODES ARE MUTUALLY EXCLUSIVE RESOURCE CONFIGURATIONS.**
# They are NOT feature flags and NOT the same thing as `[gears.*]` in clyffy.toml.
#
#   [gears.*]  = persona / prompt / COSTAR configuration. EXISTS today.
#   modes      = which processes and GPU/memory reservations are STANDING.
#                DOES NOT EXIST YET — nothing in the repo encodes this.
#
# Built in **Rust** specifically so processes and resources are reserved properly —
# explicit ownership and teardown, not best-effort coexistence.
[generation.modes]
kind = "mutually-exclusive resource configurations — never simultaneous"

coding   = "its own configuration"
training = "clyffy is DOWN — full teardown, not degraded"
avatar   = "NO coding while avatar mode is up"
creative = "requires KILLING avatar mode first, WITH A NOTICE to the operator"

transition_rule = "mode changes are explicit, announced, and tear down the previous mode — never silently overlapped"

# WHO TRIGGERS A MODE — operator, 2026-07-25: "clyffy is the UI".
# There is NO separate supervisor daemon. The SURFACE CONNECTION IS THE MODE EVENT:
# `clyffy code` or the DevPulse UI comes up, establishes the layer-2 connection between
# cluster and frontend, and in doing so declares which configuration should be standing.
# Consistent with the fabric design — every running surface joins the mesh and widens it,
# so a surface is a node arriving with an intent, not a client asking permission.
trigger = "surface connection event (clyffy code | DevPulse UI) over the layer-2 link"
conflict = "surface requests a mode that cannot coexist with the standing one -> operator NOTICE -> confirmed teardown -> new mode stands up"
note = "DevPulse UI not yet seen — operator will show it. Do not design the handshake ahead of that."

# CONSEQUENCE FOR THE ComfyUI HOST QUESTION (corrects my earlier reasoning):
# I argued ComfyUI must live off-cluster because it would contend with the brain,
# embedder and reranker. That argument assumed SIMULTANEITY, which this contract
# forbids — creative mode stands the coding config down, so the GPU is free.
# The contention argument is therefore WEAK. Two independent arguments survive:
#   1. ARM friction — ComfyUI's custom-node ecosystem assumes x86 + desktop CUDA.
#   2. Blast radius — GB10 holds the vault (Infisical), the brain and the recall
#      spine; a dedicated creative box is a far safer place to grant full admin.
# Host decision therefore rests on those two, NOT on resource contention.

# ── LIP RIM (unfrozen 2026-07-28, operator ruling) ───────────────────────────
[atlas.lips]
# The 62-vert lip RIM is skin, not interior. It was frozen in TWO independent places —
# face_atlas excluded it from every region, and shape_author protected it with the bag — so
# not one of the 43 shapes could move the lip edge and the aperture was 100% jaw-driven.
domain    = "op_jaw_region ∩ skin (260 verts)"   # the OPERATOR's selection bounds the lips,
                                                 # not a magic radius. Measured: the old
                                                 # radius-derived regions sat 251/258 INSIDE
                                                 # it and missed 118 verts, nearly all below
                                                 # the lip (7.56%H vs 1.79%H).
falloff   = "geodesic (Dijkstra over mesh edges, never through the bag)"
# Euclidean CANNOT separate the lips: the chains sit 0.0077 apart against a 0.030H reach, so
# lip_upper and lip_lower both scored ~0.99 on all 62 rim verts and "raise the upper lip"
# raised both. The mouth is genuinely cut, so surface distance separates what space cannot.
reach     = 0.090
partition = "w·w/(w_up+w_lo) — a wider reach lets weight round the commissures (cross-talk 0.454)"
cross_talk = { upper_on_lower = 0.187, lower_on_upper = 0.200, asserted_below = 0.25 }
bag_rule  = "the BAG stays protected and FOLLOWS the rim by cav_src lineage (full at the rim, zero at the back cap)"
aperture_from_lips = { frozen = 0.042, freed = 1.18, unit = "%H at full mouthUpperUp*+mouthLowerDown*" }
note = "op_jaw_region is NOT over-selected — it is a JAW map and the pipeline consumes it as one (jaw_rig rigid core, shape_author jaw falloff). op_lip_seam is the lip line proper."

# ── HOOVES (tools/hoof.py, 2026-07-28) ───────────────────────────────────────
[hoof]
# Canon: white furred forearm ending in TWO dark rounded toes. The mesh already carried the
# right toe count (two soft lobes) — what was missing was the dark keratin, and the body is
# a single texture, so the hoof gets its own material on the distal faces. Same play
# mouth_parts.py uses for teeth and tongue. NO geometry change, so this is safe after
# body_rig: vertex count, indices, weights and all 43 shape keys are untouched.
frac      = 0.38          # distal fraction of the hand blob, along the forearm axis
material  = "clyffy_hoof" # dark warm grey, NOT black — black reads as a hole
verts     = 595
faces     = 529
operator_group = "op_hoof"  # if present it WINS; `frac` is only the fallback styling guess
# ⚠️ TOE COUNT was nearly got wrong. A first read of the base sheet said THREE toes — the
# crop window straddled two panels of the turnaround and stitched one pose's hand beside
# another's. Panels are 1668/5 = 333.6 px; crop INSIDE one. Cloven means split in TWO, and
# the front and 3/4 panels agree.

[rig.body.arm_gate]
# ⚠️ 2026-07-28 — the F2 leg defect, again, on the arms. F2 gated the blanket root fold off
# the legs by HEIGHT, which the arms escape entirely: they hang beside the torso and share
# its z range. Measured on the shipped rig: hand_L max 0.436, hand_R 0.443, and NOT ONE
# vertex majority-owned by either hand bone — bound but unposeable.
# Height cannot separate an arm from the ribs, so the gate is DISTANCE TO THE ARM CHAIN,
# using the same segments and radii the arm bones are built from.
gated_verts = 3867
before = { hand_L_max = 0.436, hand_R_max = 0.443, majority_owned = 0 }
after  = { hand_L_max = 0.852, hand_R_max = 0.874, majority_owned = "152 / 171" }
posed  = { lower_arm_35deg = "1.73 -> 3.12 %H", hand_35deg = "0.44 -> 0.81 %H", torso_bleed = 0.0 }

# ── MOUTH POLISH (2026-07-28) ────────────────────────────────────────────────
[shapes.lip_amplitude]
# The jaw is capped at 10 deg by the shirt collar, so how far the lips PART is set in
# shape_author.py, not by the rig. These were 0.012H / 0.010H — chosen while the lip rim was
# still welded, when no amplitude could move the lip edge at all and the numbers only had to
# look sane. With the rim freed they became the real ceiling.
lip_up   = 0.024    # was 0.012
lip_down = 0.020    # was 0.010
corner_up   = 0.009
corner_down = 0.008
lip_driven_aperture = { before = 1.18, after = 2.35, unit = "%H at full upperUp+lowerDown" }
cavity_edge_stretch = 1.18          # rig accepts 3.85; zero edges over 2x
# ⚠️ 3x WAS REJECTED BY THE RENDER, NOT BY THE NUMBERS. It measured 3.52%H aperture at 1.27x
# stretch — still safe — but the upper lip lifted far enough to drag the muzzle pad and the
# whole face distorted. The mesh limit and the character limit are not the same limit.

[mouth_parts.teeth_scallop]
# The band is one swept solid, so it read as a continuous ridge of enamel rather than teeth.
# A raised cosine along the arc, one period per tooth, scallops the crown — discrete tips,
# no topology change, still a closed solid at 4 verts per ring.
teeth_n   = 7
teeth_cut = 0.34    # crown drop at a gap, as a fraction of tooth height (0 = flat band)
note = "26 points per arch over 7 teeth is ~3.7 samples per scallop — coarse. It reads at the aperture the 2x lips now open, but this is the sampling ceiling without more ring points."
[mouth_parts.tongue]
# 2026-07-29 — replaced the UV sphere. See BUILD_LOG "Tongue (2026-07-29)".
# EVERY dimension is a fraction of MEASURED room: bag_at(f) samples the cavity walls per
# station, so the tongue keeps fitting if mouth_open's pocket changes. Nothing here is a
# hard-coded size.
stations   = 15     # root -> tip
ring       = 16     # points around each station (+2 pole caps)
verts      = 242    # was 146
fill_lat   = 0.62   # of the local bag half-width
fill_up    = 0.58   # of the local bag height
floor_off  = 0.0010
ceil_off   = 0.0022
lip_clear  = 0.0012 # dorsum ducks this far under the LOWER LIP EDGE (not the bag ceiling)
tip_clear  = 0.0040 # stand-off from the lingual face of the lower incisors
under      = 0.24   # share of section height below the section centre
groove     = 0.20   # midline dorsal groove, fraction of local height
section_n  = 2.5    # cross-section superellipse exponent
tip_rise   = 0.16
smooth_shaded = true   # per-face, so the teeth keep their facets
fills_bag  = { lat = 58, fwd = 75, z = 55, unit = "% of bag extent, was 36/52/26" }
# THE DORSUM DUCKS UNDER THE LIP EDGE, and that is measured, not stylistic. A ray scan of the
# sealed head found a PINHOLE at z [+0.22448,+0.22484] (0.037%H tall) and the first build put
# a vertex in it. The scan also gave the shape of the constraint:
#   station f < 0.055 -> highest contained z +0.2320 (rays hit the palate)
#   station f > 0.055 -> highest contained z +0.2244 (rays reach the lip slit)
sightline_pinhole = { z_lo = 0.22448, z_hi = 0.22484, height_pct_h = 0.037 }
# Thickness comes from the BAG's room; the ceiling only CLIPS the result. Deriving thickness
# from the already-clamped ceiling counted every restriction twice and collapsed the blade
# 2.13%H -> 0.63%H between two adjacent stations (a cliff, not a taper).
# Tip profile holds 0.38, not 0.17: tapering to a needle made the pole cap a SPEARHEAD.
note = "13x12 and a 0.17 tip were the first build; both were wrong and are recorded in BUILD_LOG rather than silently replaced."

[shapes.tongue_out]
# tongueOut is a DEFORMATION, not a rigid slab, and its travel is MEASURED every build.
# The old version translated the whole tongue by a hard-coded 0.048H reasoned from the TEETH
# INSET (0.030) rather than from where the tongue sat — 4.80%H of travel against a 9.31%H
# gap, finishing 5.29%H SHORT of the lip plane. It could never protrude.
protrude    = 0.032   # of H, BEYOND the measured tip->lip gap
root_hold   = 0.12    # travel retained at the root (0 = pinned, 1 = rigid slab)
narrow      = 0.22    # lateral pinch at full extension — an extended tongue narrows
tip_vs_lip  = { before = -5.29, after = 1.71, unit = "%H, positive = past the lip plane" }
lip_open    = { lower_du = -0.020, upper_du = 0.011 }  # widened; the tip was past the lip and still barely read from the front

[rig.viseme_distinguishability]
# 2026-07-29, tools/viseme_distinct.py — MEASURED FOR THE FIRST TIME.
# The pack had always asked "does each viseme render" and never "can a viewer TELL THEM
# APART". RMS displacement over the 4264-vert mouth region between every pinned pair.
tool           = "tools/viseme_distinct.py"
region_verts   = 4264
median_sep     = 0.58   # %H
min_sep        = 0.17
max_sep        = 1.79
threshold      = 0.25   # below this the difference is at the level of shading noise
pairs_below    = 3      # of 105
dead_visemes   = []     # every viseme moves at least 0.25%H
# ⚠️ THE CONSONANTS COLLAPSE TOWARD SILENCE. Vowels separate fine (aa travels 1.73%H and is
# 1.79%H from PP); the jaw and lips carry them. But:
collapsed = [
  { pair = "DD/kk",  sep = 0.17, why = "tongue-tip vs tongue-back" },
  { pair = "CH/RR",  sep = 0.23, why = "tongue position" },
  { pair = "SS/nn",  sep = 0.25, why = "tongue position" },
  { pair = "sil/FF", sep = 0.25, why = "lower-lip-to-upper-teeth — 'f/v' is the same shape as saying nothing" },
]
# Every collapsed pair is a TONGUE-position or lip-to-teeth distinction, and the new tongue
# has exactly ONE morph (tongueOut) — it cannot go tip-up, back-up or tuck. Consequence,
# stated plainly: a talking demo on these visemes reads as a cow mouthing vowels.
root_cause = "one tongue morph; no articulation"
# ── RESOLVED 2026-07-29 by [shapes.tongue_articulation] below ────────────────
after = { pairs_failing = 0, rms_median = 0.65, rms_min = 0.28, p95_median = 1.54, p95_min = 0.51 }
after_pairs = [
  { pair = "DD/kk",  before = 0.17, after = 0.35 },
  { pair = "sil/FF", before = 0.25, after = 0.45 },
  { pair = "CH/RR",  before = 0.23, after = 0.29 },
  { pair = "SS/nn",  before = 0.25, after = "off the closest list; SS travel 0.28 -> 0.45" },
]
# TWO METRICS, because RMS alone is not a fair judge. RMS over a FIXED region is dominated by
# how MANY verts move: a jaw drop moves thousands a little and scores high, a sibilant's
# spread lips move ~230 a lot and score low though a viewer reads it instantly. P95 is the
# 95th-percentile per-vertex displacement — "is there a distinct LOCAL feature". A pair is
# only called indistinguishable when it fails BOTH.
metrics = ["RMS (global similarity)", "P95 (local feature)"]
p95_threshold = 0.60
# ⚠️ NOT EVERY PAIR SHOULD SEPARATE. Lipreading groups phonemes into viseme classes because
# /p,b,m/ genuinely look alike on a real face, as do /k,g,ng/. The standard is "pairs a human
# distinguishes should separate", NOT "all 105 separate" — the latter is fitting the metric.

[shapes.tongue_articulation]
# 2026-07-29 — EXTENSION BEYOND ARKit-52. ARKit ships `tongueOut` and no other tongue
# control, so these four are additive: the 43 ARKit keys are untouched and a consumer that
# only knows ARKit ignores them and gets exactly what it had before. Shapes 43 -> 47.
extension_of  = "ARKit-52"
additive      = true
arkit_intact  = true
shape_count   = 47
contract_keys = 42          # was 38; vrm_check verifies all of them exist in the VRM
# EVERY MAGNITUDE IS DERIVED FROM MEASURED HEADROOM, never asserted. The cavity is shallow at
# the front (the bag converges on the lip slit), so a hard-coded lift that looked right at
# the root would drive the tip through the palate. Each vertex moves a fraction of ITS OWN
# distance to the local ceiling; _cavity_ceiling() samples the bag and ducks under the upper
# teeth, the same windowed sampling mouth_parts.py uses to fit the tongue.
headroom_max  = 0.0474      # 4.85%H
clearance     = 0.0020
tongueUp     = { verts = 177, peak_pct_h = 1.70, fill = 0.85, use = "tip to the alveolar ridge — /d/ /t/ /n/ /l/ /s/" }
tongueBack   = { verts = 129, peak_pct_h = 2.78, fill = 0.80, use = "velar hump — /k/ /g/" }
tongueCurl   = { verts = 242, peak_pct_h = 3.46, fill = 0.75, use = "blade raise — postalveolar /sh/ /ch/ /r/" }
lipTuckLower = { verts = 384, peak_pct_h = 1.94, use = "lower lip behind the upper teeth — /f/ /v/" }
# CONTAINMENT HELD AT FULL STRENGTH, measured not assumed — raising the tongue toward the
# palate is exactly the change that pokes through.
containment_posed = { rest = 0, tongueUp_1 = 0, tongueBack_1 = 0, tongueCurl_1 = 0, all_three_1 = 0, of = 242 }
containment_note = "tongue visible ONLY when the jaw is open (DD 52/242, TH 87/242) — correct and wanted"
# TWO WRONG ANSWERS on nn, both caught by the tool and kept here rather than quietly replaced:
#   jawOpen 0.18 + tongueUp 0.8 + press -> SS/nn 0.25%H (same morph as SS, at the same strength)
#   jawOpen 0.04 + close 0.75 + press   -> PP/nn 0.19%H — a BILABIAL seal is /m/, not /n/
# and the weak viseme turned out to be SS, not nn: it travelled 0.28%H because its spread was
# driven at 0.5. /s/ is one of the most readable shapes on a face; the wide corners ARE the cue.

[gates.known_blind_spots]
# Three found in two days. The pattern matters more than any single one: the gates test what
# is CHEAP to test, not the states the character is actually seen in.
stale_artifacts = { found = "2026-07-28", status = "FIXED — accept.py dates every derived artifact against the mesh it descends from" }
jaw_angle       = { found = "2026-07-29", status = "FIXED — viseme_sheet.py, present.py and control_surface.py's own set_jaw_open() posed at a literal 22.0 against a 10.0 envelope; all three now read ENVELOPE" }
rest_only_containment = { found = "2026-07-29", status = "OPEN — lip_seal.py tests REST only; beauty heroes show a tooth sliver breaking the lip at the left commissure in talk_aa and a speck at the right in happy" }

[mesh.pre_existing_defects]
# Inherited from the Tripo base mesh. VERIFIED identical before and after the tongue work —
# classified rather than ignored, per the no-reward-hacking law.
# ── RESOLVED 2026-07-29 by tools/mesh_patch.py ───────────────────────────────
non_manifold_edges = 0      # was 1
boundary_edges     = 0      # was 19
resolved_by = "tools/mesh_patch.py"
# The 19 boundary edges were the SYMPTOM. The non-manifold edge (v818-v85) carried THREE
# faces, one of them a triangle of area 7.0e-08 — 0.3% of the median face — stitched across
# an otherwise open chain. Filling first only ever got 19 -> 5. Order that works:
#   remove the sliver -> holes_fill -> sweep the wire edge the deletion leaves behind.
order = ["remove sliver face", "holes_fill", "sweep wire edges"]
sliver_area = 7.034e-08
median_face_area = 2.398e-05
faces = { before = 47178, after = 47179 }
verts_unchanged = 47280
# Runs LAST and adds FACES ONLY. body_rig transfers face weights BY VERTEX INDEX and asserts
# equal counts, so anything that changes vertex count invalidates the entire chain.

[gates.renderer_check]
# 2026-07-29 — tools/renderer_check.py. THE GATES STOPPED AT THIS PACK'S BOUNDARY and the
# surface the operator actually looks at is one repo further on.
tool = "tools/renderer_check.py"
bundle = "clyffy/interfaces/clyffy-avatar/renderer/dist"
wired_into_accept = true
missing_bundle = "WARN, not FAIL — the pack must stay usable standalone"
# WHAT IT CAUGHT: the built bundle was serving a contract TWO generations stale while every
# gate here read green. public/ is symlinked to canon (correct); dist/ is a vite build output
# that had not been rebuilt since 2026-07-28, and dist/ is what the Tauri shell ships.
found = { vrm = "75197660 vs canon 82054972 bytes", schema = "5006 vs 7696 bytes", jaw_max_deg = "22.0 served vs 10.0 contract", DD_viseme = "{jawOpen, mouthClose} — predates the M5 rewrite" }
# The renderer CODE was never at fault: main.js fetches the schema at runtime and hardcodes
# nothing. The seam law held; only the built artifact had drifted.
method = "mirrors main.js:147-153 — drivenKeys from VISEMES AND PRESETS (both layers, because clearMorphs resets both), resolved against morph-target names parsed from the .glb JSON chunk"
negative_tested = "against the bundle that was actually shipping: 4 failures, exit 1"
browser_is_not_the_gate = "chromium headless boots the app but the 82 MB VRM never finishes parsing under software WebGL (stuck at 'loading vrm' through a 400s virtual-time budget)"
does_not_claim = "that the face LOOKS right — that is the operator's VERIFY gate, POAM A1"

[gates.pose_check]
# 2026-07-29 — tools/pose_check.py. lip_seal.py's containment gate only ever tested REST, the
# one pose where the lips are shut and nothing can escape by construction.
tool   = "tools/pose_check.py"
states = 30      # rest + 15 visemes + 7 presets + jawOpen sweep + corner shapes alone
status = "GREEN"
wired_into_accept = true
method = "cap the mouth with a membrane across the lip rim, then parity-test inside/outside"
# Visible-through-the-opening is IRRELEVANT and must be: teeth SHOULD show in an open mouth.
# The defect is a tooth through the CHEEK or LIP.
# ⚠️ TWO WRONG TESTS FIRST — recorded so neither is retried:
rejected_tests = [
  { method = "signed distance to nearest exterior-skin point", findings = 109, why = "with the mouth open the surface has a hole, so a tongue correctly in the aperture scores outside by up to 5.6%H" },
  { method = "ray fan + aperture polygon", findings = 1516, why = "the lip rim spans 5.85%H fore-aft and is strongly NON-PLANAR; a fitted plane self-intersects and the even-odd test is meaningless" },
]
found = "viseme PP, one upper-tooth vertex — mouthPress 0.7 takes the upper lip BEHIND the incisors. NOT the rolls (halving mouthRollUpper changed nothing); mouthClose actually rescues it. Swept: 0.55/0.60 clean, 0.65 fails. PP press 0.7 -> 0.60."

[pipeline.densify]
# 2026-07-29 — tools/densify.py. Acts on the conclusion in [shapes.surface_fold]: the lip
# tear is a topology limit, so add topology.
tool  = "tools/densify.py"
runs_after = "eye_open --cut"     # NOT after canonicalize — see below
cuts  = 1
reach = 0.070                      # of H, around the operator's op_lip_seam
verts = { before = 46838, after = 47778 }
lip_edge = { before = 0.00561, after = 0.00380, ratio_to_global_before = 1.35, ratio_to_global_after = 0.75 }
# ⚠️ PLACEMENT TOOK THREE ATTEMPTS. Running it after `canonicalize` (the obvious spot) BREAKS
# THE EYE CUT: reach 0.085 pinched the left dome boundary (degree-4 vertex) and eye_open
# refused to cut; 0.070 cut but produced 5 connected components instead of 3, and 0.060 still
# produced 4. eye_open requires EXACTLY 2 eyeball components and SILENTLY skips writing
# eye_L_center / eye_L_radius / eye_R_center / eye_R_radius otherwise, which then kills
# face_atlas four stages later with a bare KeyError.
excludes = ["mouth cavity (cav_src is an INT lineage layer and cannot be interpolated)", "eyeball shells", "eye sockets (withheld by radius)"]
preserves = "REFUSES TO SAVE if any vertex group loses members — the operator's hand selections are not reproducible"
op_groups = { op_jaw_region = "369 -> 785 (interpolated)", op_lip_seam = "60 unchanged", eye_L = "585 unchanged", eye_R = "397 unchanged" }
result = "upper-lip tear substantially reduced at demo framing; small notches remain at both commissures and there is new fine scalloping on the lower lip edge. An improvement, not a cure. Eyelid folds untouched — the sockets are deliberately withheld."
# ── EYELID DENSIFICATION: TRIED, MEASURED, REJECTED (2026-07-29) ────────────
eye_mult = 0.0
eyelid_rejected = true
eyelid_cost = "+3087 verts (46838 -> 50865 with the lip) at 2.2x eyeball radius"
eyelid_fold_rate = { eyeBlinkLeft = "0.088 -> 0.092 WORSE", eyeSquintLeft = "0.054 -> 0.060 WORSE", eyeWideLeft = "0.070 -> 0.066 same" }
eyelid_render = "side by side at identical framing the denser lid is slightly WORSE — the fold resolves into finer, more visible creasing rather than going away"
eyelid_why = "the LIP was measurably STRETCHED by mouth_open (1.35x the global median edge) and was genuinely short of mesh. The EYELID was never stretched — it folds because a closing eyelid folds. Resolution cannot fix a fold that is not a resolution deficit. Do not assume the two cases are the same problem."
socket_withholding_was_unnecessary = "the eye CUT has already happened when densify runs; verified boundary 19 (torso hole only), so both pieces are closed"

[rig.body.spine_point]
# ⚠️ A DENSITY-BIASED RIG, found because the densify exposed it. body_rig.spine_point() used
# co[m].mean(axis=0) — an unweighted mean over the vertices in a z-slab. That is NOT a
# geometric centre: it is pulled toward wherever the mesh is finest. The lip sits 0.045H from
# the neck slab and falls inside it, so 940 new lip loops dragged the neck sample sideways and
# the SKULL bone with it, and the VRM exported FACING BACKWARDS (-179.79 deg off +Z).
estimator_before = "mean over slab vertices — DENSITY-BIASED"
estimator_after  = "midpoint of the slab's fore-aft EXTENT — density-independent"
proof = { canon = "skull head (-0.0389, 0.0190, 0.2696)", densified = "skull head (-0.0389, 0.0191, 0.2696)" }
side_effect = "also made the canon export MORE accurate: VRM facing -2.10 deg -> -0.26 deg off +Z"
caught_by = "vrm_check facing test — the ONLY gate that saw it. 22 humanoid bones, 47 morphs, 3 spring chains and sum(w)=1.000000 all stayed green."

[shapes.surface_fold]
# ⚠️ DIAGNOSED, FIX TRIED, FIX REJECTED ON THE RENDER. Not open work — a measured dead end.
# Jagged black notches tear along the upper lip in open-mouth poses. Cause: face normals
# INVERTING, the surface folding through itself. Previous work measured CAVITY edge stretch
# (1.18x, fine) and never looked at SKIN normals — the same family of blind spot as the other
# four in [gates.known_blind_spots].
measured = { happy = { stretch = 3.69, edges_over_2x = 34, flips = 26 }, aa = { stretch = 3.02, edges_over_2x = 16, flips = 24 }, rest = { stretch = 1.00, flips = 0 } }
per_shape_alone = { lipTuckLower = 23, mouthUpperUpRight = 22, mouthPucker = 21, mouthUpperUpLeft = 17, mouthFunnel = 15, mouthShrugUpper = 14 }
stacking = false          # each shape folds ON ITS OWN; combinations are not the cause
fix_tried = "relax the displacement field over the mesh graph (a fold is its high-frequency component)"
fix_rejected = true
why_rejected = "unbounded it drives every fold to zero and takes the shape with it (eyeBlinkLeft 43->0 flips keeping 33% of travel = an eye that no longer closes); peak-restoration made it WORSE (mouthSmileRight 13->25); with an 85% amplitude floor the big shapes refuse to unfold at all, and the rendered before/after was not better"
root_cause = "TOPOLOGY, not parameters — too few edge loops across the lip to absorb a 2.4%H lift without the surface crossing itself"
real_fix = "retopology pass adding loops at the lip and eyelid; changes vertex count and therefore rebuilds the whole chain. A scoped job, not a tuning knob."
note = "MOST FLIPS ARE NOT DEFECTS — a closing eyelid folds because that is what an eyelid does. face_flips() now REPORTS per shape; unfold() is kept, documented and deliberately NOT called."
